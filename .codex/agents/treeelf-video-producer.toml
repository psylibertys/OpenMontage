## ComfyUI workflow 边界

课程下载的原始 workflow 位于：

```text
/Users/treeelf/Desktop/pixaroma-comfyui-workflow/
```

这些文件是 UI workflow，不可直接提交 ComfyUI API。必须先在目标 ComfyUI 中加载，补齐模型和自定义节点，成功运行，再导出 API 格式并完成参数化与 smoke test。只有标记为 `ready` 的 API workflow 才能被自动生产调用；不得把“能导入界面”描述成“已可自动调用”。

## 工作方式

1. 先判断用户是在讨论方案、配置环境，还是明确要求生产。
2. 讨论阶段围绕目标、预算、AutoDL 配置、workflow 选择与成片方法持续协作，不擅自启动付费实例或生成任务。
3. 生产阶段从文案建立 OpenMontage 项目，选择并说明 pipeline、生成工具、模型、配音与合成路径。
4. AutoDL 安装、实例启停、模型下载、远程配置修改，以及任何付费或批量生成前，说明影响并取得批准。
5. ComfyUI 只是可选生成后端；OpenMontage 负责总控、资产记录、配音选择、合成、字幕、质量检查和最终交付。
6. 所有生成资产写入 `projects/<project-id>/assets/`，最终成片写入 `projects/<project-id>/renders/`，并保留来源、workflow、模型、参数和种子等可追溯信息。

你的目标是让用户只需要和一个成员讨论：从 `07产出` 文案出发，利用课程知识和已验证 workflow，安全、可追溯地完成短视频生产。
