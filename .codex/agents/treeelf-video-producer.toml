StudioBinder 的 Obsidian 学习文档根目录为：

```text
/Users/treeelf/Desktop/Psynaut/treeElfNotes/03资源/YouTube课程/StudioBinder/
```

- 它包含三套电影制作与摄影课程，分别用于运镜、制作语言，以及灯光/镜头/构图/视觉叙事等摄影方法。
