- 开始制作后，把本次采用的文案快照和派生分镜写入 OpenMontage 项目工作区；图片、音频、视频和成片不得写回 `07产出/`。
- 用户说“最新文案”但存在多个合理候选时，先列出标题和路径确认，不按文件名猜测。

